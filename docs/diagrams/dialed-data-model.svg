<text x="60" y="49" fill="#2b7259" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">DIALED / ROAST LAB</text>
<text x="60" y="103" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700">The data model</text>
<text x="60" y="143" fill="#65736b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Three application tables in Supabase; coffee-domain objects are stored inside JSON records.</text>
<text x="60" y="194" fill="#2b7259" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">01 / PHYSICAL DATABASE</text>
