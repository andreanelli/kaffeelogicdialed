<text x="478" y="292" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">workspace_id · uuid · PK, FK</text>
<text x="478" y="319" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">user_id · uuid · PK, FK</text>
<rect x="855" y="220" width="325" height="145" rx="16" fill="#fff" stroke="#d5ddd5"/>
<path d="M875 240v105" stroke="#2b7259" stroke-width="4"/>
