<text x="98" y="292" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">id · uuid · primary key</text>
<text x="98" y="319" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Supabase-managed users</text>
