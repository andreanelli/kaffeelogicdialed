<text x="893" y="477" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">workspace_id · uuid · FK      collection · text      key · text</text>
<text x="893" y="504" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">payload · jsonb                       ordinal · bigint identity</text>
<text x="893" y="531" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Composite primary key: (workspace_id, collection, key)</text>
<polyline points="1018,365 1018,405" fill="none" stroke="#65736b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1032" y="389" fill="#65736b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">1 → many</text>
<rect x="60" y="405" width="710" height="178" rx="16" fill="#eaf0e8" stroke="#d5ddd5"/>
<text x="85" y="439" fill="#2b7259" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">FOUR COLLECTIONS</text>
<text x="85" y="471" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">entities → kind + serialized domain data</text>
<text x="85" y="498" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">files → metadata, SHA-256, original bytes as base64</text>
<text x="85" y="525" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">keys → import deduplication and batch links</text>
<text x="85" y="552" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">meta → notebook metadata and deleted-run markers</text>
<text x="60" y="632" fill="#2b7259" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">02 / LOGICAL COFFEE MODEL</text>
<text x="60" y="661" fill="#65736b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Arrows run from one object to many. These links are validated by app code, not SQL foreign keys.</text>
