<text x="893" y="319" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">name · text</text>
<text x="893" y="346" fill="#20382f" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">revision · bigint</text>
